<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}</style></head>
<body>
<iframe id="f" scrolling="no" style="border:0;display:block"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  f.style.width = (q.get('w') || 375) + 'px';
  f.style.height = (q.get('h') || 4000) + 'px';
  f.src = q.get('u') || '/index.html';
</script>
</body>
</html>
