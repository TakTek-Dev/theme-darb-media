<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500&family=Noto+Kufi+Arabic:wght@700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px;
    display: grid; place-items: center;
    background:
      radial-gradient(900px 460px at 50% 130%, rgba(251, 193, 24, 0.09), transparent 70%),
      radial-gradient(1100px 500px at 88% -20%, rgba(58, 70, 102, 0.4), transparent 62%),
      #101624;
    font-family: "Noto Kufi Arabic", Tahoma, sans-serif;
    color: #fff;
  }
  .card { text-align: center; }
  .card img { height: 210px; margin-bottom: 34px; }
  .line { font-size: 52px; font-weight: 800; line-height: 1.55; }
  .line .dot { color: #FBC118; }
  .sub {
    margin-top: 18px;
    font-family: "IBM Plex Sans Arabic", Tahoma, sans-serif;
    font-size: 24px; font-weight: 500; color: #A9B3CD;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="assets/img/logo-dark.png" alt="">
    <div class="line">نحكي عن فلسطين<span class="dot">..</span> بطريقة أخرى</div>
    <div class="sub">الأرشيف الدائم لبرامج وحلقات درب ميديا</div>
  </div>
</body>
</html>
