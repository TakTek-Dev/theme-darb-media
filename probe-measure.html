<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0">
<iframe id="f" src="/index.html" style="width:375px;height:3200px;border:0" scrolling="no"></iframe>
<pre id="out">measuring...</pre>
<script>
  const f = document.getElementById('f');
  f.addEventListener('load', () => {
    setTimeout(() => {
      const d = f.contentDocument;
      const doc = d.documentElement;
      const vw = doc.clientWidth, sw = doc.scrollWidth, bw = d.body.scrollWidth;
      let maxR = 0, minL = 0, maxEl = null, minEl = null;
      const rows = [];
      d.querySelectorAll('body *').forEach(el => {
        const cs = f.contentWindow.getComputedStyle(el);
        if (cs.position === 'fixed' || cs.display === 'none') return;
        const r = el.getBoundingClientRect();
        if (r.right > maxR) { maxR = r.right; maxEl = el; }
        if (r.left < minL) { minL = r.left; minEl = el; }
      });
      function label(el) {
        if (!el) return 'none';
        return el.tagName + '.' + String(el.className).slice(0, 60);
      }
      rows.push('vw=' + vw + ' scrollW=' + sw + ' bodyW=' + bw);
      rows.push('maxRight=' + Math.round(maxR) + ' by ' + label(maxEl));
      rows.push('minLeft=' + Math.round(minL) + ' by ' + label(minEl));
      // chain of maxEl ancestors with widths
      let p = maxEl;
      while (p && p.tagName !== 'BODY') {
        const r = p.getBoundingClientRect();
        rows.push('  ^ ' + label(p) + ' L=' + Math.round(r.left) + ' R=' + Math.round(r.right));
        p = p.parentElement;
      }
      document.getElementById('out').textContent = rows.join('\n');
      document.title = 'DONE';
    }, 2500);
  });
</script>
</body>
</html>
