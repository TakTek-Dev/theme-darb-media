<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الحلقات — درب ميديا</title>
  <meta name="description" content="الأرشيف الكامل لحلقات درب ميديا — صفِّ بالبرنامج والسنة والشهر، ورتّب بالأحدث أو الأقدم.">
  <meta property="og:site_name" content="درب ميديا">
  <meta property="og:type" content="website">
  <meta property="og:title" content="الحلقات — درب ميديا">
  <meta property="og:description" content="الأرشيف الكامل لحلقات درب ميديا — صفِّ بالبرنامج والسنة والشهر، ورتّب بالأحدث أو الأقدم.">
  <meta property="og:image" content="assets/img/og-card.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/img/mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css?v=52">
</head>
<body data-page="episodes" data-header="light">
  <div id="hdr"></div>

  <main>
    <section class="page-head">
      <div class="container">
        <h1>الحلقات</h1>
        <p class="page-sub">الأرشيف الكامل — كل ما نشرته درب ميديا في مكان واحد، مصفًّى وقابل للفرز حتى تصل إلى حلقتك في ثوانٍ.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="toolbar" aria-label="تصفية الحلقات">
          <button class="filter-open-btn" id="filterOpen">
            <svg class="icon icon--s" aria-hidden="true"><use href="#i-filter"></use></svg>
            تصفية
            <span class="filter-badge" id="filterBadge" style="display:none"></span>
          </button>

          <div class="field">
            <select data-f="p" aria-label="البرنامج"></select>
            <svg class="icon field-chev" aria-hidden="true"><use href="#i-chev-d"></use></svg>
          </div>
          <div class="field">
            <select data-f="y" aria-label="السنة"></select>
            <svg class="icon field-chev" aria-hidden="true"><use href="#i-chev-d"></use></svg>
          </div>
          <div class="field">
            <select data-f="m" aria-label="الشهر"></select>
            <svg class="icon field-chev" aria-hidden="true"><use href="#i-chev-d"></use></svg>
          </div>
          <div class="field">
            <select data-f="sort" aria-label="الترتيب"></select>
            <svg class="icon field-chev" aria-hidden="true"><use href="#i-chev-d"></use></svg>
          </div>
          <button class="chip-clear" data-clear>
            <svg class="icon icon--s" aria-hidden="true"><use href="#i-close"></use></svg>
            مسح الفلاتر
          </button>

          <span class="toolbar-count" id="resCount"></span>
        </div>

        <div class="reel-grid" id="epGrid"></div>

        <div class="empty" id="emptyState" style="display:none">
          <div class="empty-mark">
            <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
          </div>
          <h2>لم نجد نتائج مطابقة</h2>
          <p>لا توجد حلقات بهذه التصفية. جرّب توسيع الفلاتر أو مسحها والبدء من جديد.</p>
          <div class="empty-actions">
            <button class="btn btn--navy btn--s" id="emptyClear">مسح الفلاتر</button>
            <a class="btn btn--outline btn--s" href="search.html">جرّب البحث</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="ftr"></div>

  <!-- Mobile filter sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="filterSheet" role="dialog" aria-modal="true" aria-label="تصفية الحلقات">
    <div class="sheet-handle"></div>
    <h3>تصفية الحلقات</h3>
    <div class="sheet-group">
      <label for="shP">البرنامج</label>
      <div class="field">
        <select id="shP" data-f="p"></select>
        <svg class="icon field-chev" aria-hidden="true"><use href="#i-chev-d"></use></svg>
      </div>
    </div>
    <div class="sheet-group">
      <label for="shY">السنة</label>
      <div class="field">
        <select id="shY" data-f="y"></select>
        <svg class="icon field-chev" aria-hidden="true"><use href="#i-chev-d"></use></svg>
      </div>
    </div>
    <div class="sheet-group">
      <label for="shM">الشهر</label>
      <div class="field">
        <select id="shM" data-f="m"></select>
        <svg class="icon field-chev" aria-hidden="true"><use href="#i-chev-d"></use></svg>
      </div>
    </div>
    <div class="sheet-group">
      <label for="shS">الترتيب</label>
      <div class="field">
        <select id="shS" data-f="sort"></select>
        <svg class="icon field-chev" aria-hidden="true"><use href="#i-chev-d"></use></svg>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn--outline" id="sheetClear">مسح الكل</button>
      <button class="btn btn--gold" id="sheetApply">عرض النتائج</button>
    </div>
  </div>

  <script src="assets/js/data.js?v=52"></script>
  <script src="assets/js/player.js?v=52"></script>
  <script src="assets/js/app.js?v=52"></script>
</body>
</html>
